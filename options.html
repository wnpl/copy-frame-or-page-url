<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title data-i18n="optionsPageTitle"></title>
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    font-size: inherit;
    color: var(--theme-body-color, CanvasText);
    background-color: var(--theme-body-background, Canvas);
    margin: 0;
    padding: 16px;
    max-width: 600px;
  }

  form {
    color: var(--theme-body-color, CanvasText);
    background-color: var(--theme-body-background, Canvas);
  }

  p {
    margin: 1em 0;
    color: var(--theme-body-color, CanvasText);
  }

  strong {
    color: var(--theme-body-color, CanvasText);
    font-weight: bold;
  }

  em {
    color: var(--theme-secondary-text, GrayText);
    font-style: italic;
  }

  label {
    font-family: inherit;
    font-size: inherit;
    color: var(--theme-body-color, CanvasText);
    background-color: var(--theme-body-background, Canvas);
    display: block;
    margin: 0.5em 0;
    cursor: pointer;
  }

  input[type="checkbox"] {
    margin-right: 8px;
    accent-color: var(--theme-accent-color, AccentColor);
  }

  select {
    font-family: inherit;
    font-size: inherit;
    color: var(--theme-toolbar-field-color, FieldText);
    background-color: var(--theme-toolbar-field-background, Field);
    border: 1px solid var(--theme-toolbar-field-border-color, ButtonBorder);
    padding: 4px 6px;
    margin: 0 4px;
  }

  a {
    color: var(--theme-link-color, -moz-mac-accentdarkshadow);
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  .chk {
    margin: 0.5em 0;
  }

  .chk label {
    display: inline;
    margin: 0;
  }
</style>
</head>
<body>
<form>
<p class="chk"><label><input type="checkbox" name="allpages"> <span data-i18n="optionAllPages"></span></label><br>

<p><strong data-i18n="sectionPageActionButton"></strong></p>
<p class="chk"><label><input type="checkbox" name="pageaction"> <span data-i18n="optionShowPageAction"></span></label><br>

<p><strong data-i18n="sectionModifierActions"></strong></p>
<p>
<label><span data-i18n="labelClickPlain"></span>&nbsp; 
<select name="clickplain">
    <option value="url" data-i18n="formatUrl"></option>
    <option value="markdown" data-i18n="formatMarkdown"></option>
    <option value="html" data-i18n="formatHtml"></option>
</select>
</label><br>

<label><span data-i18n="labelClickShift"></span> 
<select name="clickshift">
    <option value="url" data-i18n="formatUrl"></option>
    <option value="markdown" data-i18n="formatMarkdown"></option>
    <option value="html" data-i18n="formatHtml"></option>
</select>
</label><br>

<label><span data-i18n="labelClickCtrl"></span> 
<select name="clickctrl">
    <option value="url" data-i18n="formatUrl"></option>
    <option value="markdown" data-i18n="formatMarkdown"></option>
    <option value="html" data-i18n="formatHtml"></option>
</select>
</label> (on Mac, Command+click)<br><br>
<em data-i18n="noteFrameUrlLimitation"></em>
</p>

<p><strong data-i18n="sectionMiscellaneous"></strong></p>
<p class="chk"><label><input type="checkbox" name="decode"> <span data-i18n="optionDecodeUnicode"></span></label>

<p><strong data-i18n="sectionKeyboardShortcut"></strong></p>
<p data-i18n="linkManageShortcuts"></p>

<script src="options.js"></script>
</body>
</html>
