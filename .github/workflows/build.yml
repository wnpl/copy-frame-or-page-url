name: Build Extension

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install web-ext
        run: npm install --global web-ext

      - name: Lint extension
        run: web-ext lint

      - name: Build XPI
        run: web-ext build

      - name: Rename artifact
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          ARTIFACT_NAME="copy-frame-or-page-url-$VERSION.xpi"
          # web-ext creates a .zip file, rename it to .xpi
          mv web-ext-artifacts/*.zip "web-ext-artifacts/$ARTIFACT_NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-xpi
          path: web-ext-artifacts/*.xpi

  # Create release on tag push
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: extension-xpi
          path: artifacts

      - name: Get version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: v${{ steps.version.outputs.version }}
          body: |
            ## Changes
            - Add internationalization (i18n) support for English and German
            - Remove inline styles from options.html
            - Add comprehensive README.md and CONTRIBUTING.md
            - Fix pageAction.setTitle error
            - Add build automation scripts
          files: |
            artifacts/*.xpi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
