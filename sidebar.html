<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title data-i18n="sidebarTitle"></title>
<style>
  :root {
    --light-bg: #ffffff;
    --light-text: #0c0c0d;
    --light-field-bg: #ffffff;
    --light-field-text: #0c0c0d;
    --light-field-border: #797979;
    --light-secondary-text: #616161;
    --light-link-color: #0060df;
    --light-accent: #0060df;
    --light-border: #e0e0e0;
    --light-card-bg: #f5f5f5;

    --dark-bg: #1e1e1e;
    --dark-text: #ffffff;
    --dark-field-bg: #2d2d2d;
    --dark-field-text: #ffffff;
    --dark-field-border: #505050;
    --dark-secondary-text: #909090;
    --dark-link-color: #79c0ff;
    --dark-accent: #79c0ff;
    --dark-border: #404040;
    --dark-card-bg: #2d2d2d;
  }

  html {
    background-color: var(--light-bg);
  }

  @media (prefers-color-scheme: dark) {
    html {
      background-color: var(--dark-bg);
    }
    :root {
      --bg: var(--dark-bg);
      --text: var(--dark-text);
      --field-bg: var(--dark-field-bg);
      --field-text: var(--dark-field-text);
      --field-border: var(--dark-field-border);
      --secondary-text: var(--dark-secondary-text);
      --link-color: var(--dark-link-color);
      --accent: var(--dark-accent);
      --border: var(--dark-border);
      --card-bg: var(--dark-card-bg);
    }
  }

  @media (prefers-color-scheme: light) {
    html {
      background-color: var(--light-bg);
    }
    :root {
      --bg: var(--light-bg);
      --text: var(--light-text);
      --field-bg: var(--light-field-bg);
      --field-text: var(--light-field-text);
      --field-border: var(--light-field-border);
      --secondary-text: var(--light-secondary-text);
      --link-color: var(--light-link-color);
      --accent: var(--light-accent);
      --border: var(--light-border);
      --card-bg: var(--light-card-bg);
    }
  }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 14px;
    color: var(--text);
    background-color: var(--bg);
    margin: 0;
    padding: 16px;
    min-width: 300px;
  }

  h1 {
    font-size: 18px;
    margin: 0 0 16px 0;
    color: var(--text);
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
  }

  .notice {
    color: var(--secondary-text);
    font-size: 13px;
    margin: 0 0 16px 0;
    padding: 8px;
    background-color: var(--field-bg);
    border-radius: 4px;
    border: 1px solid var(--border);
  }

  .empty-message {
    color: var(--secondary-text);
    text-align: center;
    padding: 20px;
    font-style: italic;
  }

  .link-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 16px;
  }

  .link-card {
    background-color: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .link-card .date {
    font-size: 11px;
    color: var(--secondary-text);
    text-align: right;
  }

  .link-card .title {
    font-weight: bold;
    color: var(--text);
    word-break: break-word;
  }

  .link-card .url {
    color: var(--link-color);
    font-size: 12px;
    word-break: break-all;
  }

  .link-card .url a {
    color: var(--link-color);
    text-decoration: none;
  }

  .link-card .url a:hover {
    text-decoration: underline;
  }

  .link-card .original-link {
    color: var(--secondary-text);
    font-size: 11px;
  }

  .link-card .original-link a {
    color: var(--secondary-text);
    text-decoration: none;
  }

  .link-card .original-link a:hover {
    text-decoration: underline;
  }

  .link-card .actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .link-card button {
    font-family: inherit;
    font-size: 12px;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background-color: var(--field-bg);
    color: var(--text);
    cursor: pointer;
    flex: 1;
    min-width: 80px;
  }

  .link-card button:hover {
    background-color: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  .link-card button.delete:hover {
    background-color: #d32f2f;
    border-color: #d32f2f;
  }

  .link-card button.bookmark:hover {
    background-color: #4CAF50;
    border-color: #4CAF50;
  }

  .clear-all-container {
    display: flex;
    justify-content: center;
    margin-top: 16px;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }

  .clear-all-container button {
    font-family: inherit;
    font-size: 14px;
    padding: 8px 16px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background-color: var(--field-bg);
    color: var(--text);
    cursor: pointer;
  }

  .clear-all-container button:hover {
    background-color: #d32f2f;
    border-color: #d32f2f;
    color: white;
  }

  a {
    color: var(--link-color);
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
<div class="notice" id="private-notice" style="display: none;"></div>
<div class="notice" id="limit-notice"></div>
<div id="link-container">
  <div class="empty-message" id="empty-message" data-i18n="sidebarEmpty"></div>
  <div class="link-list" id="link-list"></div>
</div>
<div class="clear-all-container">
  <button id="clear-all" data-i18n="sidebarClearAll"></button>
</div>

<script src="sidebar.js"></script>
</body>
</html>
