name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@eef6245b326360399e008565273a46047247a821

      - name: Setup Node.js
        uses: actions/setup-node@6105775099f90e8158f168b8736f029828644c9c
        with:
          node-version: '24'

      - name: Install web-ext
        run: npm install --global web-ext

      - name: Install dependencies
        run: npm ci

      - name: Lint extension
        run: npm run lint

      - name: Build XPI
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Building version: $VERSION"
          
          # Create artifacts directory
          mkdir -p artifacts
          
          # Build with web-ext
          web-ext build --overwrite-dest
          
          # Rename artifact
          ARTIFACT_NAME="copy-link-to-page-$VERSION.xpi"
          mv web-ext-artifacts/*.xpi "artifacts/$ARTIFACT_NAME"
          
          echo "ARTIFACT_PATH=artifacts/$ARTIFACT_NAME" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@0887125763443213e5313a533a45364a27544235
        with:
          files: ${{ env.ARTIFACT_PATH }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
